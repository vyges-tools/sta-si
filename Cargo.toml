[package]
name = "vyges-sta-si"
version = "0.1.46"
edition = "2021"
description = "Static timing analysis with signal integrity: WNS/TNS sign-off with a CI gate."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/sta-si"

# One third-party dep, through loom's `gzip` feature: miniz_oxide (pure Rust), so gzipped
# Liberty and netlists (`.lib.gz`, `.v.gz`) read as the reference reads them. The shared
# parsers + design model come from the vyges-loom foundation — sibling-checkout path dep in
# dev; release pins a git/version dep. (sta-si is loom's seed: these readers originated here.)
[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []

[dependencies]
vyges-loom = { git = "https://github.com/vyges-tools/loom", branch = "main", features = ["gzip"] }
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

[[bin]]
name = "vyges-sta-si"
path = "src/main.rs"

[lib]
name = "vyges_sta_si"
path = "src/lib.rs"
